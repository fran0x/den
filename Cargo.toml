[package]
# `den` is taken on crates.io; the library and the command keep the name `den`.
name = "den-tui"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
default-run = "den"
description = "A terminal inspector for your developer machine, read-only by default: Homebrew, Codex and Claude Code, AWS, Kubernetes, Docker and toolchains"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fran0x/den"
homepage = "https://github.com/fran0x/den"
readme = "README.md"
keywords = ["tui", "homebrew", "inspector", "developer-tools", "terminal"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**/*.rs",
    "/fixtures/brew.json",
    "/fixtures/demo.json",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[lib]
name = "den"
path = "src/lib.rs"

[[bin]]
name = "den"
path = "src/main.rs"

# den with Homebrew write actions allowed; den itself stays read-only.
[[bin]]
name = "dew"
path = "src/bin/dew.rs"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
# use-dev-tty reads input with poll(2): the default mio source can strand keys that
# arrive with a window resize until the next key press.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
# Pin while using rendered-line-info for exact wrapped-text scroll bounds.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "1"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
# Nonblocking process pipes and process-group cleanup on Homebrew platforms.
libc = "0.2"

# AGENTS.md: reserve unwrap/expect for tests (clippy.toml allows them there) and
# document every unsafe block.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
mod_module_files = "deny"
