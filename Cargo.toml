[package]
name = "den"
version = "0.1.0"
edition = "2024"
description = "A read-only terminal inspector for your local developer environment"
publish = false

[dependencies]
crossterm = "0.29"
# Pin while using rendered-line-info for exact wrapped-text scroll bounds.
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "1.2.0", default-features = false, features = ["deserialize"] }
serde_json = "1"
toml = { version = "0.9.12", default-features = false, features = ["parse", "serde", "std"] }

[target.'cfg(unix)'.dependencies]
# Nonblocking process pipes and process-group cleanup on Homebrew platforms.
libc = "0.2"
