# cargo-deny: dependency policy checked in CI (`cargo deny check`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# Known vulnerabilities, unmaintained and yanked crates from the RustSec advisory database.
[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

# Only these licenses may appear in the dependency tree.
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

# Den itself is not published.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Crates may come only from crates.io: no git or other registries.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
