name: Release

# Releasing:
#   1. Bump `version` in Cargo.toml and move the CHANGELOG notes under it, with the date.
#   2. Run `just ci` and `cargo publish --dry-run --locked --target-dir target/publish`
#      (a separate target keeps the normal build from going stale); push and let CI pass.
#   3. Push a tag such as v0.2.0 on that commit.
#   4. Once it is published, run `just tap` and push the formula in fran0x/homebrew-tap.
# This workflow checks the tag matches Cargo.toml, builds den and dew for macOS and Linux,
# creates the GitHub release, and publishes den-tui to crates.io.
#
# crates.io uses trusted publishing: no token is stored anywhere. crates.io trusts this
# repository (fran0x/den), this workflow (release.yml) and the GitHub environment
# `crates-io`, which accepts only `v*` tags. The environment name must match crates.io's
# trusted-publisher entry exactly (a hyphen, not "crates.io"). Publishing runs only while
# the repository variable PUBLISH_CRATE is true. If it fails, fix the cause and re-run the
# failed job: a re-run uses the workflow from the tagged commit.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          name="den-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/den" "target/${{ matrix.target }}/release/dew" README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: den-*.tar.gz*
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Den $GITHUB_REF_NAME" \
            --generate-notes

  # Trusted publishing: a short-lived crates.io token in exchange for this job's identity.
  crates-io:
    name: Publish to crates.io
    needs: release
    if: vars.PUBLISH_CRATE == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked
